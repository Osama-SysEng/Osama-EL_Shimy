    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070913" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#grad)" stroke-width="7" filter="url(#glow)" />
  <circle cx="32" cy="18" r="3" fill="#38bdf8" />
